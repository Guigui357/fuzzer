<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>JSPI Battery</title>
</head>
<body>
<script>
/*
 * Minimal WASM:
 *
 * (module
 *   (import "e" "s" (func $s (param i32) (result i32)))
 *   (func (export "f") (param i32) (result i32)
 *     local.get 0
 *     call $s
 *     local.get 0
 *     call $s
 *     i32.add
 *   )
 * )
 */

const wasmBytes = new Uint8Array([
  0x00, 0x61, 0x73, 0x6d,
  0x01, 0x00, 0x00, 0x00,

  // Type section
  0x01, 0x04,
  0x01,
  0x60, 0x01, 0x7f, 0x01, 0x7f,

  // Import section
  0x02, 0x07,
  0x01,
  0x01, 0x65,
  0x01, 0x73,
  0x00, 0x00,

  // Function section
  0x03, 0x02,
  0x01, 0x00,

  // Export section
  0x07, 0x05,
  0x01,
  0x01, 0x66,
  0x00, 0x01,

  // Code section
  0x0a, 0x0d,
  0x01,
  0x0b,
  0x00,
  0x20, 0x00,
  0x10, 0x00,
  0x20, 0x00,
  0x10, 0x00,
  0x6a,
  0x0b
]);

const results = [];

function check(name, fn) {
  return Promise.resolve()
    .then(fn)
    .then(
      value => {
        results.push([
          name,
          'ok',
          value
        ]);
      },
      error => {
        results.push([
          name,
          'THROW',
          error && (
            error.name + ': ' + error.message
          )
        ]);
      }
    );
}

function withTimeout(promise, ms) {
  return Promise.race([
    promise,

    new Promise(resolve => {
      setTimeout(() => {
        resolve('TIMEOUT');
      }, ms);
    })
  ]);
}

(async () => {

  /*
   * JSPI availability
   */
  if (
    typeof WebAssembly === 'undefined' ||
    !('Suspending' in WebAssembly) ||
    !('promising' in WebAssembly)
  ) {
    document.title = 'no JSPI';

    document.body.textContent =
      'JSPI não está disponível neste ambiente.';

    return;
  }

  /*
   * Base instance
   */
  const { instance } =
    await WebAssembly.instantiate(
      wasmBytes,
      {
        e: {
          s: WebAssembly.Suspending(
            async x => x
          )
        }
      }
    );

  const f =
    WebAssembly.promising(
      instance.exports.f
    );

  /*
   * 1. Double suspend + result correctness
   */
  await check(
    'double-suspend',
    () =>
      f(21).then(
        r =>
          r === 42
            ? 'ok'
            : 'WRONG:' + r
      )
  );

  /*
   * 2. Reentrant calls
   */
  await check(
    'reentrant',
    () => {
      const g =
        WebAssembly.promising(
          instance.exports.f
        );

      return g(1)
        .then(() => g(2))
        .then(() => 'done');
    }
  );

  /*
   * 3. GC pressure while suspended
   *
   * Reduced from 1,000,000 allocations
   * to avoid intentionally exhausting memory.
   */
  await check(
    'gc-during-suspend',
    () => {
      let junk = [];

      const p =
        f(7).then(
          v =>
            junk.length
              ? 'done'
              : 'x'
        );

      for (let i = 0; i < 10000; i++) {
        junk.push(
          new ArrayBuffer(4096)
        );
      }

      return p;
    }
  );

  /*
   * 4. Resolve with incompatible JS value
   */
  await check(
    'resolve-symbol',
    async () => {

      const { instance: inst2 } =
        await WebAssembly.instantiate(
          wasmBytes,
          {
            e: {
              s: WebAssembly.Suspending(
                async () =>
                  Symbol('x')
              )
            }
          }
        );

      const g =
        WebAssembly.promising(
          inst2.exports.f
        );

      return g(1).then(
        v => 'got:' + v
      );
    }
  );

  /*
   * 5. Never resolve
   *
   * A timeout prevents the whole battery
   * from hanging indefinitely.
   */
  await check(
    'never-resolve',
    async () => {

      const { instance: inst3 } =
        await WebAssembly.instantiate(
          wasmBytes,
          {
            e: {
              s: WebAssembly.Suspending(
                () =>
                  new Promise(
                    () => {}
                  )
              )
            }
          }
        );

      const g =
        WebAssembly.promising(
          inst3.exports.f
        );

      return withTimeout(
        g(1).then(
          v => 'leak-then:' + v
        ),
        2000
      );
    }
  );

  /*
   * 6. Exception inside suspending import
   */
  await check(
    'throw-in-suspending',
    async () => {

      const { instance: inst4 } =
        await WebAssembly.instantiate(
          wasmBytes,
          {
            e: {
              s: WebAssembly.Suspending(
                async () => {
                  throw new RangeError(
                    'boom'
                  );
                }
              )
            }
          }
        );

      return WebAssembly
        .promising(inst4.exports.f)(1)
        .then(
          () => 'NO-THROW',
          error =>
            error &&
            error.name +
            ': ' +
            error.message
        );
    }
  );

  /*
   * 7. promising() with non-function
   */
  await check(
    'promising-nonfn',
    () =>
      WebAssembly.promising(42)
  );

  /*
   * Final output
   */
  console.log(
    'JSPI battery results:',
    results
  );

  document.title =
    JSON.stringify(
      results,
      null,
      1
    );

  /*
   * Also show readable results
   * in the page.
   */
  const pre =
    document.createElement('pre');

  pre.textContent =
    JSON.stringify(
      results,
      null,
      2
    );

  document.body.appendChild(pre);

})();
</script>
</body>
</html>
