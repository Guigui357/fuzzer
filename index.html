<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sto26 · Fuzzer Cego (sem CVEs)</title>
    <style>
        body { background: #0a0c12; color: #ccc; font-family: monospace; padding: 20px; }
        .log { background: #03050a; height: 40vh; overflow-y: auto; padding: 10px; border-radius: 12px; font-size: 12px; }
        .payloads { background: #1e1e2a; height: 30vh; overflow-y: auto; padding: 10px; border-radius: 12px; font-size: 11px; margin-top: 10px; }
        button { background: #2f5b8c; border: none; padding: 8px 16px; border-radius: 40px; color: white; margin: 5px; cursor: pointer; }
        .stats { display: flex; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
        .stat { background: #0b0e16; padding: 8px 16px; border-radius: 20px; }
    </style>
</head>
<body>
<div>
    <h1>🧬 Fuzzer Cego · WebKit (apenas métodos não corrigidos)</h1>
    <div class="stats">
        <div class="stat">🔢 Testes: <span id="count">0</span></div>
        <div class="stat">💥 Crashes salvos: <span id="crashCount">0</span></div>
        <div class="stat">⏱️ Iterações/seg: <span id="rate">0</span></div>
        <div class="stat">🔄 Reloads auto: <span id="reloadCount">0</span></div>
    </div>
    <div>
        <button id="startBtn">▶ INICIAR (sem CVEs)</button>
        <button id="stopBtn" disabled>⏹️ PARAR</button>
        <button id="exportBtn" disabled>💾 Exportar payloads</button>
        <button id="clearBtn">🗑️ Limpar</button>
    </div>
    <div class="log" id="log"></div>
    <div class="payloads" id="payloadsList"></div>
</div>
<script>
    (function(){
        let running = false;
        let testCount = 0;
        let crashPayloads = [];
        let startTime = 0;
        let autoReloadCount = 0;
        let queue = [];
        let processing = false;
        let lastPayload = "";
        
        const logDiv = document.getElementById('log');
        const payloadsDiv = document.getElementById('payloadsList');
        const countSpan = document.getElementById('count');
        const crashSpan = document.getElementById('crashCount');
        const rateSpan = document.getElementById('rate');
        const reloadSpan = document.getElementById('reloadCount');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const exportBtn = document.getElementById('exportBtn');
        const clearBtn = document.getElementById('clearBtn');
        
        function log(msg, type='info') {
            const line = document.createElement('div');
            line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if(type==='success') line.style.color = '#8bcb8b';
            else if(type==='error') line.style.color = '#ff8a7a';
            else if(type==='crash') line.style.color = '#ffaa66';
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function updateUI() {
            countSpan.innerText = testCount;
            crashSpan.innerText = crashPayloads.length;
            reloadSpan.innerText = autoReloadCount;
            if (running && startTime) {
                let elapsed = (Date.now() - startTime) / 1000;
                rateSpan.innerText = elapsed > 0 ? Math.floor(testCount / elapsed) : 0;
            } else rateSpan.innerText = 0;
            payloadsDiv.innerHTML = "";
            for (let i = 0; i < crashPayloads.length; i++) {
                let p = crashPayloads[i];
                let div = document.createElement('div');
                div.style.borderBottom = '1px solid #333';
                div.style.marginBottom = '8px';
                div.style.paddingBottom = '8px';
                div.innerHTML = `<b>${i+1}. ${p.type}</b> <small>${new Date(p.timestamp).toLocaleString()}</small><br>
                                <details><summary>Ver payload completo</summary>
                                <pre style="background:#0a0a12;padding:4px;white-space:pre-wrap;word-break:break-all;">${escapeHtml(p.payload)}</pre>
                                </details>`;
                payloadsDiv.appendChild(div);
            }
        }
        
        function escapeHtml(s) {
            return s.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;');
        }
        
        // ========== GERADOR ALEATÓRIO (sem nenhum padrão de CVE) ==========
        // APIs recentes e mutações de código puro
        
        const keywords = ['let', 'const', 'var', 'function', 'class', 'if', 'for', 'while', 'try', 'new', 'return', 'typeof', 'instanceof'];
        const operators = ['+', '-', '*', '/', '%', '<<', '>>', '>>>', '&', '|', '^', '&&', '||', '===', '!==', '<', '>', '<=', '>='];
        const builtins = ['Math', 'Date', 'Array', 'Object', 'String', 'Number', 'Boolean', 'RegExp', 'Promise', 'Map', 'Set', 'WeakMap', 'WeakSet', 'Int8Array', 'Uint8Array', 'Int16Array', 'Uint16Array', 'Int32Array', 'Uint32Array', 'Float32Array', 'Float64Array', 'BigInt64Array', 'BigUint64Array', 'DataView', 'ArrayBuffer', 'SharedArrayBuffer', 'Atomics', 'JSON', 'Reflect', 'Proxy', 'WebAssembly', 'URL', 'URLSearchParams', 'TextEncoder', 'TextDecoder', 'AbortController', 'Fetch', 'WebSocket', 'Worker', 'OffscreenCanvas', 'ImageBitmap', 'Crypto', 'SubtleCrypto', 'Performance', 'Intl', 'FinalizationRegistry', 'WeakRef', 'Iterator', 'AsyncIterator', 'AggregateError', 'EvalError', 'RangeError', 'ReferenceError', 'SyntaxError', 'TypeError', 'URIError'];
        
        function random(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function randomString(len) { let s=''; for(let i=0;i<len;i++) s+=String.fromCharCode(random(97,122)); return s; }
        function randomIdent() { return randomString(random(3,12)); }
        function randomNumber() { return random(-100000, 100000); }
        function randomFloat() { return (Math.random() * 100000) - 50000; }
        
        // Gera expressão aleatória simples
        function randomExpr(depth=0) {
            if (depth > 3) return randomNumber().toString();
            let type = random(0,3);
            if (type === 0) return randomNumber().toString();
            if (type === 1) return randomFloat().toString();
            if (type === 2) return `"${randomString(random(1,10))}"`;
            if (type === 3) return `${randomIdent()}${random(0,1)===0?`[${randomNumber()}]`:''}`;
            return `(${randomExpr(depth+1)} ${operators[random(0,operators.length-1)]} ${randomExpr(depth+1)})`;
        }
        
        // Cria um bloco de código aleatório
        function randomBlock() {
            let lines = random(1, 10);
            let code = "";
            for (let i=0; i<lines; i++) {
                let choice = random(0, 10);
                if (choice < 3) {
                    let varName = randomIdent();
                    code += `let ${varName} = ${randomExpr()};\n`;
                } else if (choice < 6) {
                    let builtin = builtins[random(0, builtins.length-1)];
                    code += `let x = new ${builtin}(${randomExpr()});\n`;
                } else if (choice < 8) {
                    code += `try { ${randomExpr()} } catch(e) { }\n`;
                } else {
                    code += `${randomIdent()} = ${randomExpr()};\n`;
                }
            }
            return code;
        }
        
        // Gerador principal: cria código aleatório (nenhum padrão conhecido)
        function generateRandomCode() {
            let parts = [];
            let numFuncs = random(0, 3);
            for (let i=0; i<numFuncs; i++) {
                let funcName = randomIdent();
                let args = Array(random(0,3)).fill(0).map(()=>randomIdent()).join(',');
                let body = randomBlock();
                parts.push(`function ${funcName}(${args}) { ${body} }`);
            }
            let mainBlock = randomBlock();
            parts.push(mainBlock);
            // Adicionar loops simples (não infinitos)
            if (random(0,10) < 3) {
                let loopVar = randomIdent();
                parts.push(`for(let ${loopVar}=0; ${loopVar}<${random(1,100)}; ${loopVar}++) { ${randomBlock()} }`);
            }
            // Adicionar Promise para assincronismo
            if (random(0,10) < 2) {
                parts.push(`new Promise((resolve,reject)=>{ setTimeout(()=>{ resolve(${randomExpr()}); }, ${random(1,10)}); }).then(()=>{ ${randomBlock()} });`);
            }
            // Tentar acessar API obscura (ex: CSS, import maps)
            if (random(0,10) < 2) {
                parts.push(`document.createElement('style').innerText = '*{--var-${randomString(5)}:${randomNumber()}px}'`);
            }
            if (random(0,10) < 2) {
                parts.push(`try { import.meta; } catch(e) {}`);
            }
            return parts.join('\n');
        }
        
        // ========== EXECUÇÃO EM WORKER ==========
        function executeInWorker(payload, callback) {
            const workerCode = `
                try {
                    ${payload}
                    postMessage({ type: 'success' });
                } catch(e) {
                    postMessage({ type: 'exception', error: e.toString() });
                }
            `;
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            const worker = new Worker(URL.createObjectURL(blob));
            const timeout = setTimeout(() => {
                worker.terminate();
                callback({ type: 'timeout' });
            }, 500);
            worker.onmessage = (e) => {
                clearTimeout(timeout);
                callback(e.data);
                worker.terminate();
            };
            worker.onerror = (err) => {
                clearTimeout(timeout);
                callback({ type: 'error', error: err.message });
                worker.terminate();
            };
        }
        
        // Fila
        function processQueue() {
            if (!running) return;
            if (processing) return;
            if (queue.length === 0) {
                setTimeout(processQueue, 20);
                return;
            }
            processing = true;
            let payload = queue.shift();
            lastPayload = payload;
            localStorage.setItem('last_payload', payload);
            executeInWorker(payload, (result) => {
                processing = false;
                testCount++;
                if (result.type === 'timeout') {
                    log("⏰ Timeout (possível hang)", 'warning');
                    crashPayloads.push({ timestamp: Date.now(), type: 'timeout_hang', payload: payload });
                    updateUI();
                } else if (result.type === 'exception') {
                    if (result.error.includes("out of memory") || result.error.includes("RangeError")) {
                        log(`⚠️ Exceção: ${result.error.substring(0,80)}`, 'warning');
                    }
                } else if (result.type === 'error') {
                    log(`🌐 Erro: ${result.error}`, 'error');
                }
                updateUI();
                processQueue();
            });
        }
        
        function addPayloadsContinuously() {
            if (!running) return;
            let payload = generateRandomCode();
            queue.push(payload);
            if (queue.length > 200) queue.shift();
            testCount++;
            updateUI();
            setTimeout(addPayloadsContinuously, 2);
        }
        
        function startFuzzing() {
            if (running) return;
            running = true;
            startTime = Date.now();
            log("🚀 Fuzzer cego iniciado. Gerando código aleatório (nenhum padrão de CVE).");
            addPayloadsContinuously();
            processQueue();
            startBtn.disabled = true;
            stopBtn.disabled = false;
            exportBtn.disabled = false;
        }
        
        function stopFuzzing() {
            running = false;
            queue = [];
            log("⏸️ Fuzzer parado.");
            startBtn.disabled = false;
            stopBtn.disabled = true;
        }
        
        function exportPayloads() {
            if (crashPayloads.length === 0) { log("Nada para exportar.", 'warning'); return; }
            let content = "# Fuzzer Cego - Payloads suspeitos\n\n";
            for (let i=0; i<crashPayloads.length; i++) {
                let p = crashPayloads[i];
                content += `=== ${p.type} (${new Date(p.timestamp).toISOString()}) ===\n${p.payload}\n\n`;
            }
            const blob = new Blob([content], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `cego_fuzzer_${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(blob);
            log(`Exportados ${crashPayloads.length} payloads.`, 'success');
        }
        
        function clearAll() {
            crashPayloads = [];
            queue = [];
            localStorage.removeItem('last_payload');
            autoReloadCount = 0;
            testCount = 0;
            updateUI();
            log("Dados limpos.");
        }
        
        function checkReload() {
            if (performance.navigation && performance.navigation.type === 1) {
                autoReloadCount++;
                updateUI();
                let saved = localStorage.getItem('last_payload');
                if (saved && saved !== "null") {
                    log("🔄 Reload automático detectado! Crash real.", 'crash');
                    crashPayloads.push({ timestamp: Date.now(), type: 'reload_crash', payload: saved });
                    updateUI();
                }
            }
        }
        
        startBtn.onclick = startFuzzing;
        stopBtn.onclick = stopFuzzing;
        exportBtn.onclick = exportPayloads;
        clearBtn.onclick = clearAll;
        
        checkReload();
        updateUI();
        log("✅ Fuzzer cego carregado. Nenhum padrão de CVE – apenas mutações aleatórias e APIs recentes.");
    })();
</script>
</body>
</html>
